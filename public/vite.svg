<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#14192b" />
      <stop offset="100%" stop-color="#090b12" />
    </radialGradient>

    <!-- Vibrant Wave/Gradient Glow -->
    <linearGradient id="primaryWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="secondaryWaveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#4a00e0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Equalizer / Vinyl Background Rings -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="250" cy="250" r="160" stroke-dasharray="4 8" />
    <circle cx="250" cy="250" r="130" stroke-dasharray="40 10 10 10" />
    <circle cx="250" cy="250" r="100" stroke-dasharray="2 4" />
  </g>

  <!-- Dynamic Soundwave Bars (Left) -->
  <g fill="url(#secondaryWaveGrad)" opacity="0.8">
    <rect x="80" y="235" width="7" height="30" rx="3.5" />
    <rect x="98" y="215" width="7" height="70" rx="3.5" />
    <rect x="116" y="190" width="7" height="120" rx="3.5" />
    <rect x="134" y="170" width="7" height="160" rx="3.5" />
    <rect x="152" y="200" width="7" height="100" rx="3.5" />
  </g>

  <!-- Dynamic Soundwave Bars (Right) -->
  <g fill="url(#primaryWaveGrad)" opacity="0.8">
    <rect x="341" y="200" width="7" height="100" rx="3.5" />
    <rect x="359" y="170" width="7" height="160" rx="3.5" />
    <rect x="377" y="190" width="7" height="120" rx="3.5" />
    <rect x="395" y="215" width="7" height="70" rx="3.5" />
    <rect x="413" y="235" width="7" height="30" rx="3.5" />
  </g>

  <!-- Central Musical Note Icon with Neon Glow -->
  <g filter="url(#neonGlow)">
    <!-- Intertwined Fluid Wave Paths creating Note Head & Stem -->
    <path d="M 195 280 
             C 180 250, 200 210, 240 200
             C 270 192, 280 160, 280 130
             L 300 130
             C 300 180, 270 215, 235 225
             C 210 232, 200 255, 215 275
             Z" fill="url(#primaryWaveGrad)" />

    <!-- Secondary Wave Strand forming the Beam -->
    <path d="M 280 130 
             C 310 135, 330 155, 335 180
             C 315 165, 295 155, 280 158
             Z" fill="url(#secondaryWaveGrad)" />

    <!-- Main Note Stem -->
    <rect x="272" y="130" width="16" height="145" rx="8" fill="url(#primaryWaveGrad)" />

    <!-- Vibrant Musical Note Base -->
    <ellipse cx="230" cy="275" rx="44" ry="30" transform="rotate(-22 230 275)" fill="url(#secondaryWaveGrad)" />
    
    <!-- Secondary Glow Core -->
    <ellipse cx="236" cy="272" rx="22" ry="13" transform="rotate(-22 236 272)" fill="#ffffff" opacity="0.35" />
  </g>

  <!-- Floating Sparkles / Audio Pulse Nodes -->
  <circle cx="150" cy="145" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="350" cy="135" r="4" fill="#ff007f" filter="url(#neonGlow)" />
  <circle cx="320" cy="310" r="5" fill="#00d2ff" filter="url(#neonGlow)" />
</svg>